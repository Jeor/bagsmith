<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BagSmith · 2.0 Workshop</title><link rel="stylesheet" href="style.css"></head>
<body><header class="workshop"><div><strong>BagSmith</strong><span>2.0 Workshop</span></div><nav aria-label="Demo controls"><label>Inventory <select id="scenario"><option value="everyday">Everyday</option><option value="full">Full Bags</option><option value="long">Long Categories</option><option value="empty">Empty Bags</option></select></label><button id="share">Copy View Link</button><button id="reset">Reset</button></nav></header>
<main id="stage"><div id="workspace"><aside id="drawer" class="frame" aria-label="Bag Options"><div class="drawer-title">Bag Options<button id="close-drawer" aria-label="Close bag options">‹</button></div><div class="drawer-scroll" id="options"></div><button class="settings" id="settings"></button></aside><section id="bag" class="frame" aria-label="Bag inventory"><header class="bag-title"><button id="toggle-drawer" aria-label="Toggle bag options" aria-expanded="true"></button><h1>Bags</h1><select aria-label="Character" id="character"><option>Hex Loothur · 28</option><option>Elowen · 60</option></select><button id="close-bag" aria-label="Close bags">×</button></header><div class="search-row"><span id="search-icon"></span><input id="search" aria-label="Search inventory" placeholder="Search"><button id="filter" aria-label="Show only uncommon or better items" aria-pressed="false"></button></div><div id="inventory" tabindex="-1"></div><nav id="tabs" aria-label="Inventory categories"></nav><footer class="bag-footer"><span id="money"></span><span class="capacity"><span id="bagbar"></span><span id="space"></span></span></footer></section></div><button id="reopen" hidden>Open Bags</button></main>
<footer class="demo-note">Interactive visual prototype · Sample inventory · Changes stay in this browser<span>Drag the bag’s lower-right corner to resize</span></footer><div id="tooltip" role="tooltip" hidden></div><div id="toast" role="status"></div><dialog id="dialog"><header><h2 id="dialog-title"></h2><button id="dismiss" aria-label="Close dialog">×</button></header><div id="dialog-content"></div></dialog><script type="module" src="app.js"></script></body></html>
