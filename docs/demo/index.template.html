<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BagSmith · 2.0 Workshop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="workshop">
      <div>
        <strong>BagSmith</strong><span>2.0 Workshop</span
        ><small id="release-label"></small>
      </div>
      <nav aria-label="Demo controls">
        <label
          >Inventory
          <select id="scenario">
            <option value="everyday">Character Bags</option>
            <option value="original">Original Sample</option>
            <option value="rarities">All Rarities</option>
            <option value="stacks">Stack Stress Test</option>
            <option value="full">Full Bags</option>
            <option value="long">Long Categories</option>
            <option value="empty">Empty Bags</option>
          </select></label
        ><label
          >Rarity
          <select id="rarity" aria-label="Rarity"></select></label
        ><button id="appearance-shortcut">Fonts &amp; Appearance</button
        ><button id="reload-demo">Refresh Demo</button
        ><button id="share">Copy View Link</button
        ><button id="reset">Reset</button>
      </nav>
    </header>
    <main id="stage">
      <div id="workspace">
        <aside id="drawer" class="frame" aria-label="Bag Options">
          <div class="drawer-title">
            Bag Options<button id="close-drawer" aria-label="Close bag options">
              ‹
            </button>
          </div>
          <div class="drawer-scroll" id="options"></div>
          <button class="settings" id="settings"></button>
        </aside>
        <aside id="currencies" class="frame" aria-label="Currencies" hidden>
          <div class="drawer-title">
            Currencies<button
              id="close-currencies"
              aria-label="Close currencies"
            >
              ‹
            </button>
          </div>
          <div class="currency-summary">
            <span id="currency-owner"></span
            ><strong id="currency-gold"></strong>
          </div>
          <input
            id="currency-search"
            type="search"
            aria-label="Search currencies"
            placeholder="Search currencies"
          />
          <div id="currency-list" class="drawer-scroll"></div>
          <div class="currency-bottom">
            <label class="select-label"
              >Track an Item<select
                id="track-item"
                aria-label="Track an item as currency"
              ></select></label
            ><button id="add-tracked">Track Item</button>
            <p>Pin currencies to the bag footer.</p>
            <button id="restore-pins">Restore Default Pins</button>
          </div>
        </aside>
        <section id="bag" class="frame" aria-label="Bag inventory">
          <header class="bag-title">
            <button
              id="toggle-drawer"
              aria-label="Toggle bag options"
              aria-expanded="true"
            ></button>
            <h1 id="bag-heading">Bags</h1>
            <button id="exit-travel" hidden>Exit Travel Mode</button>
            <select aria-label="Character" id="character"></select
            ><button id="close-bag" aria-label="Close bags">×</button>
          </header>
          <div class="search-row">
            <span id="search-icon"></span
            ><input
              id="search"
              aria-label="Search inventory"
              placeholder="Search"
            /><button
              id="filter"
              aria-label="Inventory filters"
              aria-pressed="false"
            ></button>
          </div>
          <div id="inventory-status" aria-live="polite"></div>
          <div id="inventory" tabindex="-1"></div>
          <nav id="tabs" aria-label="Inventory categories"></nav>
          <footer class="bag-footer">
            <button
              id="money"
              aria-label="Toggle currency drawer"
              title="Open or close currencies"
            ></button>
            <div id="pinned-currencies" aria-label="Pinned currencies"></div>
            <span class="capacity"
              ><span id="bagbar"></span><span id="space"></span
            ></span>
          </footer>
        </section>
      </div>
      <button id="reopen" hidden>Open Bags</button>
    </main>
    <footer class="demo-note">
      Interactive visual prototype · Sample inventory · Changes stay in this
      browser<span>Drag the bag’s lower-right corner to resize</span>
    </footer>
    <div id="tooltip" role="tooltip" hidden></div>
    <div id="toast" role="status"></div>
    <dialog id="dialog">
      <header>
        <h2 id="dialog-title"></h2>
        <button id="dismiss" aria-label="Close dialog">×</button>
      </header>
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
